services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pawtrack
      MYSQL_USER: pawtrack
      MYSQL_PASSWORD: pawtrack
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"

  php:
    build: ./docker/php
    volumes:
      - ./api:/var/www
    depends_on:
      - mysql

  nginx:
    image: nginx:alpine
    volumes:
      - ./api:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    ports:
      - "8000:80"

  node:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./app:/app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"

volumes:
  mysql_data: